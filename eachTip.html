<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>

    <!-- Main content goes here -->
    <main class="container mt-5">
      <a href="main.html" class="btn btn-light bg-info mt-2" style="margin-bottom: 60px"
        >Back to Tips</a
      >
      <h1 id="tipName">Loading...</h1>
      <p id="postedBy" class="text-muted mb-1 d-none"></p>
      <div class="d-flex align-items-center gap-2 mt-1">
  <span id="avgStars" class="d-inline-flex gap-1"></span>
  <span id="avgText" class="text-muted small"></span>
</div>
      <img
        id="tipImage"
        class="img-fluid rounded mt-3"
        style="max-width: 400px"
        src=""
        alt="Tip image"
      />
      <div class="mt-2 d-flex align-items-center gap-3">
        <i
          id="fav-Btn"
          class="bi bi-heart text-danger d-inline-flex align-items-center justify-content-center "
          role="button"
          title="Favourite"
          style="width: 40px; height: 40px; font-size: 1.25rem;"
        ></i>
        <div id="rateStars" class="d-inline-flex gap-1" title="Rate"></div>
      </div>
      <p class="mt-2">
        <span class="badge rounded-pill bg-accent text-white border fw-normal">
          <i class="bi bi-eye-fill me-1"></i><span id="viewCount">0</span> views
        </span>
      </p>

      <!-- holds the badges -->
      <div id="tipBadges" class="d-flex flex-wrap gap-2 mb-2"></div>
      <p id="tipDetails"></p>

      <section class="container mt-4">
  
  <form id="commentForm" novalidate>
    <div class="mb-3">
      <label for="commentText" class="form-label" style="font-size: large;">Add a comment</label>
      <textarea id="commentText" class="form-control" style="background-color: #FFF;" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-info" style="margin-bottom: 45px;">Post comment</button>
  </form>
</section>

<section class="container mt-4 card shadow-sm bg-light">
  <h2>Latest Comments</h2>
  <div id="comments-go-here"></div>
</section>

<template id="commentTemplate">
  <div class="comment-node mb-2">
    <div class="card">
      <div class="card-body bg-light">
        <h5 class="card-title comment-title d-none"></h5>
        <h6 class="card-subtitle mb-2 text-muted comment-meta"></h6>
        <p class="card-text comment-text"></p>

       <div class="d-flex flex-wrap gap-2 align-items-center">
        <button type="button" class="btn btn-sm btn-outline-success like-btn">
          <i class="bi bi-hand-thumbs-up"></i> <span class="like-count">0</span>
        </button>
        <button type="button" class="btn btn-sm btn-outline-danger dislike-btn">
          <i class="bi bi-hand-thumbs-up"></i> <span class="dislike-count">0</span>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary reply-btn">
          <i class="bi bi-reply"></i> Reply
        </button>
        <button type="button" class="btn btn-sm btn-outline-danger delete-btn d-none">
          <i class="bi bi-trash"></i> Delete
        </button>
       </div>

        <form class="reply-form d-none mt-2" novalidate>
          <textarea class="form-control form-control-sm mb-2 reply-input bg-light" rows="2"
                    placeholder="Write a reply..."></textarea>
          <button type="submit" class="btn btn-sm btn-info">Post reply</button>
          <button type="button" class="btn btn-sm btn-secondary reply-cancel">Cancel</button>
        </form>
      </div>
    </div>

    <!-- Child replies go here, indented -->
    <div class="replies d-none mt-2 ms-3 ps-3 border-start"></div>
  </div>
</template>
    </main>

    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/eachTip.js"></script>
  </body>
</html>
