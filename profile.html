<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>
    
    <!-- Main content goes here -->
             <main class="container py-4" style="max-width: 720px;">

        <!-- Header: avatar + name + email -->
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="position-relative" style="width: 64px; height: 64px;">
  <img id="avatarImg" class="rounded-circle d-none" alt="Profile picture"
       style="width: 64px; height: 64px; object-fit: cover;">

  <div id="avatar" class="rounded-circle bg-warning fw-bold fs-3 d-flex align-items-center justify-content-center"
       style="width: 64px; height: 64px;">?</div>

  <button type="button" id="changePhotoBtn" title="Change photo"
          class="btn btn-light border rounded-circle position-absolute bottom-0 end-0 p-0 d-flex align-items-center justify-content-center"
          style="width: 26px; height: 26px;">
    <i class="bi bi-camera-fill small"></i>
  </button>
  <input type="file" id="photoInput" accept="image/*" class="d-none">
</div>
            <div>
                <h1 id="profileName" class="h3 mb-0">My profile</h1>
                <small id="profileEmail" class="text-muted"></small>
            </div>
        </div>

        <!-- Section 1: About me -->
        <div class="card shadow-sm mb-5">
            <div class="card-body bg-light">
                <h2 class="h5 card-title mb-3"><i class="bi bi-person-fill me-1"></i>About me</h2>
                <div id="profileAlert" class="alert alert-success d-none" role="alert"></div>

                <form id="profileForm" novalidate>
                    <div class="mb-3">
                        <label for="nameInput" class="form-label bg-light">Name</label>
                        <input type="text" id="nameInput" class="form-control bg-white" disabled />
                    </div>
                    <div class="mb-3">
                        <label for="countryInput" class="form-label bg-light">Country</label>
                        <input type="text" id="countryInput" class="form-control bg-white" disabled />
                    </div>
                    <div class="mb-3">
                        <label for="schoolInput" class="form-label bg-light">Education</label>
                        <input type="text" id="schoolInput" class="form-control bg-white" disabled />
                    </div>
                    <div class="mb-3">
                        <label for="bioInput" class="form-label bg-light">About me</label>
                        <textarea id="bioInput" class="form-control bg-white" rows="3" disabled></textarea>
                    </div>
                    <button type="button" id="editBtn" class="btn btn-outline-secondary">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </button>
                    <button type="submit" id="saveBtn" class="btn bg-info" disabled>
                        <i class="bi bi-check-lg me-1 "></i>Save
                    </button>
                </form>
            </div>
        </div>

        <!-- Section 2: My favourite tips -->
        <h2 class="h5 mb-3"><i class="bi bi-heart-fill text-danger me-1"></i>My favourite tips</h2>
        <div id="tips-go-here" class="row row-cols-1 row-cols-md-2 g-3"></div>

    </main>

    <template id="tipCardTemplate">
        <div class="col-md-6 col-lg-3">
            <div class="card position-relative">
                <img class="card-img-top card-image" src="..." alt="Tip Image">
                <i class="bi bi-heart text-danger fav-btn position-absolute top-0 end-0 m-2 d-flex align-items-center justify-content-center rounded-circle" 
                role="button" title="Favourite"
                style="width: 40px; height: 40px; font-size: 1.25rem; background-color: #FFF;"></i>
                <div class="card h-100 p-3 bg-light">
                    <h5 class="card-title"></h5>
                    <p class="card-text"></p>
                    <div class="card-badges d-flex flex-wrap gap-1 mb-2"></div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-light bg-info read-more" href="#">Read More</a>
                        <button type="button" class="btn btn-outline-danger delete-tip d-none">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <!-- our own footer goes here -->
    <site-footer></site-footer>
    
    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/profile.js"></script>

</body>

</html>
