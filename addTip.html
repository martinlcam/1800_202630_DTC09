<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>
    
    <!-- Main content goes here -->
     <main class="container py-4" style="max-width: 560px;">
        <h1>Add a Tip</h1>

        <form id="addTipForm" novalidate>
            <div class="mb-3">
                <label for="tipNameInput" class="form-label">Tip Name</label>
                <input type="text" id="tipNameInput" class="form-control" required />
            </div>
<div class="row g-3 my-4">
    <div class="col-md-4">
        <label for="categoryFilter" class="form-label">Filter by Category</label>
        <select id="categoryFilter" class="form-select">
            <option value="Image">Image</option>
            <option value="Video">Video</option>
            <option value="Article">Article</option>
            <option value="Other">Other</option>
        </select>
    </div>
    <div class="col-md-4">
        <label for="typeFilter" class="form-label">Filter by Type</label>
        <select id="typeFilter" class="form-select">
            <option value="AI">AI</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Social Media">Social Media</option>
            <option value="Deepfakes">Deepfakes</option>
            <option value="Phishing/Scams">Phishing/Scams</option>
        </select>
    </div>
</div>
<div id="tipsContainer" class="row g-4"></div>
            <div class="mb-3">
                <label for="detailsInput" class="form-label">Details</label>
                <textarea id="detailsInput" class="form-control" rows="3" placeholder="What tips do you have for spotting AI?"></textarea>
            </div>
            <div class="mb-3">
    <label for="imageInput" class="form-label">Add cover image (optional)</label>
    <input type="file" id="imageInput" class="form-control" accept="image/*" />
    <img id="imagePreview" class="img-fluid rounded mt-2 d-none" alt="Preview" />
</div>
<div class="d-flex justify-content-center gap-2">
    <a href="main.html" id="cancelBtn" class="btn btn-outline-secondary">
        <i class="bi bi-x-lg me-1"></i>Cancel
    </a>
    <button type="submit" id="saveBtn" class="btn btn-info">
        <i class="bi bi-check-lg me-1"></i>Save
    </button>
</div>
        </form>
 </main>

    <!-- our own footer goes here -->
    <site-footer></site-footer>
    
    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/addTip.js"></script>

</body>

</html>
